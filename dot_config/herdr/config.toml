onboarding = false

[theme]
name = "catppuccin"


[terminal]
default_shell = ""
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# split_vertical   = "prefix+v"        # split right (herdr default)
# split_horizontal = "prefix+minus"    # split down  (herdr default)

reload_config = "prefix+shift+r"     # or: herdr server reload-config

workspace_picker = "prefix+w"
goto             = "prefix+g"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "herdr-ws-pick"
width = "50%"
height = "60%"

[[keys.command]]
key = "prefix+shift+s"
type = "popup"
command = "herdr-svc-pick"
width = "50%"
height = "60%"

# herdr-annotate (Plannotator): installed by run_once_after_install_herdr_plugins.sh.
# Ctrl-clicking a file://…md link opens it for review via the plugin's own handler.

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[ui]
mouse_capture  = true
copy_on_select = true
sidebar_start_collapsed = false
confirm_close = true

[session]
resume_agents_on_restore = true
