# Perixx only -- the laptop's built-in keyboard stays untouched as a way back
# in. Live copy is /etc/keyd/default.conf, installed by the run_onchange script.

[ids]
04f2:0402

[main]
# Tap to arm the next keypress; hold still works as a normal modifier.
capslock = oneshot(control)
leftmeta = oneshot(meta)
leftalt  = oneshot(alt)

# Leader key for the Hyprland submap. Left Alt still covers every ALT chord.
rightalt = f13
